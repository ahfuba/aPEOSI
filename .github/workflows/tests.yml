name: tests

# Runs every test on Windows, Linux and macOS for several Python versions,
# on every push and pull request. The badge in README.md shows the result.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m unittest discover tests -v
